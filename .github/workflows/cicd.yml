name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ipguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ipguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - name: Check frontend
        run: |
          npm run lint
          npm run typecheck
          node --experimental-strip-types --test scripts/tests/probe-history.test.mjs
      - name: Check deployment retention
        run: python3 -m unittest discover -s scripts/tests -p 'test_cleanup_deployments.py'
      - name: Check daily database maintenance
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ipguard_test?sslmode=disable
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          python3 -m unittest discover -s scripts/tests -p 'test_daily_maintenance.py'
      - name: Check backend
        run: |
          go -C backend test ./...
          go -C backend vet ./...
      - name: Check probe data retention
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ipguard_test?sslmode=disable
        run: go -C backend test -run 'TestProbeCompaction' -count=1
      - name: Build application and probe downloads
        run: |
          npm run api:build
          npm run probe:build
          npm run build
      - name: Package Linux x64 release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/ci/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ip-list-linux-x64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ip-list-linux-x64-${{ github.sha }}
          path: dist
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload and deploy the built release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          port="${DEPLOY_PORT:-22}"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          remote_dir="/var/tmp/ip-list-cicd/$RUN_ID"
          ssh_options=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          cleanup_remote() {
            ssh "${ssh_options[@]}" -p "$port" "$target" "rm -rf '$remote_dir'" || true
          }
          trap cleanup_remote EXIT
          ssh "${ssh_options[@]}" -p "$port" "$target" "install -d -m 700 '$remote_dir'"
          scp "${ssh_options[@]}" -P "$port" "dist/ip-list-$REVISION.tar.gz" "dist/ip-list-$REVISION.tar.gz.sha256" scripts/deploy-release.sh scripts/cleanup-deployments.py "$target:$remote_dir/"
          ssh "${ssh_options[@]}" -p "$port" "$target" "bash '$remote_dir/deploy-release.sh' '$REVISION' '$remote_dir/ip-list-$REVISION.tar.gz'"
      - name: Deployment summary
        env:
          REVISION: ${{ github.sha }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          printf 'Deployed `%s` to %s. The server ran the prebuilt release without compiling.\n' "$REVISION" "$PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
