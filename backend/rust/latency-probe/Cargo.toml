[package]
name = "latency-probe"
version = "0.1.0"
edition = "2021"
description = "IP Guard latency probe (Rust): ICMP/TCP measurement, heartbeat and TLS pinning"

[[bin]]
name = "latency-probe"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
der = { version = "0.7", features = ["alloc", "oid"] }
network-interface = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.5"
webpki-roots = "0.26"
x509-cert = "0.2"
