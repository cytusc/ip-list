[package]
name = "control"
version = "0.1.0"
edition = "2021"
description = "IP Guard Rust control plane and static UI gateway"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
bytes = "1"
http = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
redis = { version = "0.27", features = ["tokio-comp"] }
tokio-postgres = "0.7"
bcrypt = "0.15"
url = "2"
sha2 = "0.10"
aes-gcm = "0.10"
deadpool-postgres = "0.14.2"
dotenvy = "0.15.7"
